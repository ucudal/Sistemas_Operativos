site_name: Sistemas Operativos
site_description: Documentación del curso Sistemas Operativos
site_url: https://ucudal.github.io/Sistemas_Operativos/

theme:
  name: material
  language: es
  logo: images/logo.png

  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.footer
    - content.code.copy
    - search.highlight
